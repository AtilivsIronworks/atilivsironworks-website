name: Build VLFBERHT research PDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-vlfberht-pdf.yml"
      - ".github/workflows/optimize-vlfberht-images.yml"
      - "scripts/build_vlfberht_pdf.py"
      - "research/vlfberht-swords/index.html"
      - "research/vlfberht-swords/*.jpg"
      - "assets/river-witham/inscription-and-guard.jpg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vlfberht-pdf-main
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        run: python -m pip install --disable-pip-version-check --quiet "weasyprint>=62,<70" beautifulsoup4 pypdf

      - name: Export complete illustrated article
        run: python scripts/build_vlfberht_pdf.py

      - name: Verify generated PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          file = Path("research/vlfberht-swords/vlfberht-swords.pdf")
          pdf = PdfReader(str(file))
          pages = len(pdf.pages)
          content = "\n".join(p.extract_text() or "" for p in pdf.pages)
          required = ["VLFBERHT Swords", "The Pohansko Sword", "Conclusion", "References", "Figure 7."]
          missing = [x for x in required if x not in content]
          print(f"Validated PDF: {pages} pages, {file.stat().st_size:,} bytes")
          if pages < 5 or missing:
              raise SystemExit(f"PDF verification failed. Missing text: {missing}")
          PY

      - name: Commit downloadable PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/vlfberht-swords/vlfberht-swords.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build downloadable illustrated VLFBERHT research paper PDF"
            # Concurrent article edits can advance main while the PDF is rendering.
            # Rebase this generated-file commit on the current head before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push conflicted with another update; retry $attempt/5"
              sleep 2
            done
            echo "Could not publish PDF after five attempts" >&2
            exit 1
          else
            echo "PDF is unchanged."
          fi
