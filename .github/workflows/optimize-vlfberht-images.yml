name: Optimize VLFBERHT web photographs

on:
  push:
    branches: [main]
    paths:
      - "scripts/optimize_vlfberht_images.py"
      - ".github/workflows/optimize-vlfberht-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vlfberht-image-optimization-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --quiet "Pillow>=11,<13"
      - name: Make optimized copies and update web references
        run: python scripts/optimize_vlfberht_images.py
      - name: Validate references and retained originals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          base = Path("research/vlfberht-swords")
          html = (base / "index.html").read_text()
          import re
          srcs = re.findall(r'<img\s+src="([^"]+)"', html)
          figure_count = html.count("<figcaption>")
          for name in ("01-mannheim-ulfberht.jpg", "03-schwedt-inscription.jpg", "04-schwedt-sword.jpg"):
              assert (base / name).is_file(), f"Original missing: {name}"
              web = name.replace(".jpg", "-web.jpg")
              assert (name in srcs) or (web in srcs), f"Missing reference: {name}"
              if web in srcs:
                  assert (base / web).is_file(), f"Optimized image missing: {web}"
                  assert (base / web).stat().st_size < (base / name).stat().st_size * .85
          assert len(srcs) == 7
          assert figure_count == 7
          print("Images, citations and figure count verified.")
          PY
      - name: Commit optimized images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/vlfberht-swords/index.html research/vlfberht-swords/*-web.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Use optimized VLFBERHT web images while retaining originals"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi

      - name: Regenerate research PDF after image update
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-vlfberht-pdf.yml --ref main
